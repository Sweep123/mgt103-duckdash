<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckDash · Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="recipes">

<main>
<section class="page">
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>What can I make <span class="squiggle">with this?</span></h1>
        <p>Cheap stuff you can cook on one burner. Prices are per serving at ShopRite.</p>
      </div>
      <label class="search"><i data-lucide="search"></i><input placeholder="rice, eggs, spinach…"></label>
    </div>
    <div class="rec-bar">
      <div class="seg" id="recTabs">
        <button class="active" data-r="have"><i data-lucide="refrigerator" class="ic-sm"></i> What I Have</button>
        <button data-r="recent"><i data-lucide="receipt" class="ic-sm"></i> Recently Bought</button>
        <button data-r="mine"><i data-lucide="bookmark" class="ic-sm"></i> My Recipes</button>
      </div>
      <div class="chips">
        <button class="chip active">Anything</button>
        <button class="chip">Vegetarian</button>
        <button class="chip">30g+ protein</button>
        <button class="chip">Under 20 min</button>
      </div>
    </div>
    <div class="have-strip" id="recStrip"></div>
    <div class="recipes" id="recipes"></div>
  </div>
</section>
</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="js/common.js"></script>
<script src="js/recipes.js"></script>
</body>
</html>
